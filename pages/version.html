<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:">
	<title>О браузере</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="common.css">
</head>
<body class="version">
	<main>
		<div class="hero">
			<div class="logo">P</div>
			<div>
				<h1>Problet</h1>
				<div class="ver" id="ver"></div>
				<div class="upd" id="upd"></div>
			</div>
		</div>

		<div class="grid" id="grid"></div>

		<div class="actions">
			<button id="copy" class="primary">Скопировать сведения</button>
			<button id="check">Проверить обновления</button>
		</div>
		<p id="status" class="status"></p>

		<section id="debug" class="debug" hidden>
			<h2>Меню отладки</h2>
			<div class="actions">
				<button data-debug="force-update">Принудительно обновить браузер</button>
				<button data-debug="clear-cookies">Очистить куки</button>
				<button data-debug="clear-site-data">Очистить данные сайтов</button>
				<button data-debug="clear-cache">Очистить кеш</button>
				<button data-debug="reset-settings">Сбросить настройки</button>
				<button data-debug="remove-extensions">Удалить все расширения</button>
				<button data-debug="open-data">Открыть папку с данными</button>
				<button data-debug="open-log">Открыть журнал</button>
				<button data-debug="devtools">Инструменты разработчика интерфейса</button>
				<button data-debug="restart">Перезапустить браузер</button>
			</div>
		</section>
	</main>
	<script src="version.js"></script>
</body>
</html>
