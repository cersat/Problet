<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ошибка</title>
	<style>
/*THEME*/
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 100vh; margin: 0; padding: 24px 16px; box-sizing: border-box; }
.box { text-align: center; padding: 8px 24px 0; }
.game { width: min(680px, 100%); margin-top: 18px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); box-sizing: border-box; }
.game h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; text-align: center; color: var(--muted); }
/*MAZE_CSS*/
.err { color: var(--danger); }
h1 { font-size: 22px; margin: 12px 0 6px; }
p { color: var(--muted); margin: 0 0 20px; word-break: break-all; }
a.btn { display: inline-block; padding: 9px 18px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
	</style>
</head>
<body>
	<div class="box">
		<h1>Не удалось открыть страницу</h1>
		<p>{{url}}</p>
		<p class="err">{{desc}} ({{code}})</p>
		<a class="btn" href="{{href}}">Попробовать снова</a>
	</div>
	<div class="game">
		<h2>Раз уж ты здесь — пройди лабиринт</h2>
		<div id="maze" data-compact="1"></div>
	</div>
	<script>/*MAZE_JS*/</script>
</body>
</html>
