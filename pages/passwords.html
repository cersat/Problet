<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:">
	<script src="i18n-en.js"></script>
	<script src="i18n.js"></script>
	<title>Пароли</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="common.css">
</head>
<body class="passwords">
	<main>
		<header>
			<h1>Пароли</h1>
			<span class="grow"></span>
			<button id="change-open" class="hidden">Сменить мастер-пароль</button>
			<button id="lock" class="hidden">Запереть</button>
		</header>
		<p id="status" class="status"></p>

		<form id="gate" class="card hidden" autocomplete="off">
			<h2 id="gate-title"></h2>
			<p id="gate-hint" class="hint"></p>
			<input id="master" type="password" placeholder="Мастер-пароль" autocomplete="off">
			<input id="master2" type="password" placeholder="Ещё раз тот же мастер-пароль" autocomplete="off" class="hidden">
			<button id="gate-go" class="primary" type="submit"></button>
		</form>

		<form id="change" class="card hidden" autocomplete="off">
			<h2>Новый мастер-пароль</h2>
			<input id="old-master" type="password" placeholder="Текущий мастер-пароль" autocomplete="off">
			<input id="new-master" type="password" placeholder="Новый мастер-пароль" autocomplete="off">
			<div class="row-buttons">
				<button class="primary" type="submit">Сменить</button>
				<button id="change-cancel" type="button">Отмена</button>
			</div>
		</form>

		<div id="vault" class="hidden">
			<section id="pending-box" class="card hidden">
				<h2>Ждут сохранения</h2>
				<div id="pending"></div>
			</section>
			<form id="add" class="card" autocomplete="off">
				<h2>Добавить вручную</h2>
				<div class="add-row">
					<input id="add-site" type="text" placeholder="Сайт, например example.com" spellcheck="false" autocomplete="off">
					<input id="add-user" type="text" placeholder="Логин" spellcheck="false" autocomplete="off">
					<input id="add-pass" type="password" placeholder="Пароль" autocomplete="off">
					<button class="primary" type="submit">Добавить</button>
				</div>
			</form>
			<input id="search" type="text" placeholder="Поиск по сайту или логину" spellcheck="false" autocomplete="off">
			<div id="list"></div>
		</div>
	</main>
	<script src="passwords.js"></script>
</body>
</html>
