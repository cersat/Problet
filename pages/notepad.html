<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src about:">
	<script src="i18n-en.js"></script>
	<script src="i18n.js"></script>
	<title>Блокнот</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="common.css">
	<link rel="stylesheet" href="notepad.css">
</head>
<body class="np-page">
	<header id="bar">
		<div id="name" title=""></div>
		<div id="marks"></div>
		<span class="grow"></span>
		<span id="state"></span>
		<div class="seg" role="tablist">
			<button id="m-edit" class="on" role="tab">Редактор</button>
			<button id="m-view" role="tab">Просмотр</button>
		</div>
		<button id="save" title="Сохранить (Ctrl+S)">Сохранить</button>
	</header>
	<main>
		<div id="editor" spellcheck="false"></div>
		<div id="view" class="hidden"></div>
	</main>
	<script src="icons.js"></script>
	<script src="notepad.js"></script>
</body>
</html>
