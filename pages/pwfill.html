<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:">
	<script src="i18n-en.js"></script>
	<script src="i18n.js"></script>
	<title>Подставить пароль</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="common.css">
	<link rel="stylesheet" href="pwsave.css">
</head>
<body class="pwsave-page">
	<h1 id="title">Подставить пароль?</h1>
	<form id="lock" hidden>
		<p class="note">Хранилище закрыто. Введи мастер-пароль, чтобы подставить сохранённый пароль</p>
		<input type="password" id="master" placeholder="Мастер-пароль" autocomplete="off" style="width:100%;margin-bottom:8px">
		<p id="err" class="note" style="color:#d94b4b"></p>
		<div class="row">
			<button class="primary" type="submit">Открыть</button>
			<button type="button" class="cancel">Отмена</button>
		</div>
	</form>
	<div id="pick" hidden>
		<p class="note" id="site"></p>
		<div id="items" class="items"></div>
		<div class="row"><button class="cancel">Не подставлять</button></div>
	</div>
	<script src="pwfill.js"></script>
</body>
</html>
