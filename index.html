<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:">
	<title>Problet</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="tabbar" id="tabbar">
		<button id="spaces" class="spaces" title="Пространства"><span id="space-name"></span></button>
		<div id="tabs" class="tabs"></div>
		<button id="newtab" class="newtab" title="Новая вкладка (Ctrl+T). Правая кнопка: вкладка инкогнито">+</button>
		<div class="grow"></div>
		<div id="slot-tab" class="slot"></div>
	</div>
	<div class="toolbar">
		<button id="back" title="Назад (Alt+←)" disabled>←</button>
		<button id="forward" title="Вперёд (Alt+→)" disabled>→</button>
		<button id="reload" title="Обновить (Ctrl+R)">⟳</button>
		<div class="address" id="address-box">
			<input id="address" type="text" spellcheck="false" autocomplete="off"
				placeholder="URL, путь к файлу, HTML-код или поисковый запрос">
			<button id="pwoffer" class="inner pwoffer hidden" title="Сохранить пароль">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="8.5" cy="14" r="3.5"/><path d="M11 12l8-8M16 7l2.5 2.5M13.5 9.5L15 11"/></svg>
			</button>
			<button id="zoom" class="inner zoom hidden" title="Масштаб страницы: нажми, чтобы вернуть 100%"></button>
			<button id="star" class="inner" title="Добавить в закладки (Ctrl+D)" disabled>
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>
			</button>
		</div>
		<button id="update" class="hidden" title="Доступно обновление">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20V9M7.5 13.5L12 9l4.5 4.5M5 5h14"/></svg>
		</button>
		<button id="chars" title="Таблица символов">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6 19h4M8 19c0-3-3-4-3-8a5 5 0 0 1 10 0c0 4-3 5-3 8M14 19h4"/></svg>
		</button>
		<button id="bookmarks" title="Закладки (Ctrl+Shift+O)">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4h10v16l-5-4-5 4z"/></svg>
		</button>
		<button id="passwords" title="Пароли (Ctrl+Shift+K)">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="8.5" cy="14" r="3.5"/><path d="M11 12l8-8M16 7l2.5 2.5M13.5 9.5L15 11"/></svg>
		</button>
		<button id="history" title="История (Ctrl+H)">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>
		</button>
		<button id="downloads" title="Загрузки (Ctrl+J)">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>
		</button>
		<button id="settings" title="Настройки (Ctrl+,)">
			<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
		</button>
		<div id="slot-tool" class="slot"></div>
	</div>
	<div class="bmbar" id="bmbar"></div>
	<div class="mid"></div>
	<div id="winctl" class="winctl">
		<button id="win-min" title="Свернуть"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h8"/></svg></button>
		<button id="win-max" title="Развернуть"><svg id="win-max-icon" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="2.2" width="7.6" height="7.6"/></svg></button>
		<button id="win-close" class="close-win" title="Закрыть"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
	</div>
	<script src="renderer.js"></script>
</body>
</html>
