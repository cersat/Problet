<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; frame-src * problet: file: data: blob:">
	<script src="pages/i18n-en.js"></script>
	<script src="pages/i18n.js"></script>
	<script src="pages/icons.js"></script>
	<title>Problet</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="titlebar" id="titlebar"></div>
	<div class="tabbar" id="tabbar">
		<button id="spaces" class="spaces" title="Пространства"><span id="space-name"></span></button>
		<div id="tabs" class="tabs"></div>
		<button id="newtab" class="newtab" title="Новая вкладка (Ctrl+T). Правая кнопка: вкладка инкогнито" data-icon="plus"></button>
	</div>
	<div class="toolbar" id="toolbar">
		<button id="back" title="Назад (Alt+←)" disabled></button>
		<button id="forward" title="Вперёд (Alt+→)" disabled></button>
		<button id="reload" title="Обновить (Ctrl+R)" data-icon="reload"></button>
		<div class="address" id="address-box">
			<input id="address" type="text" spellcheck="false" autocomplete="off"
				placeholder="URL, путь к файлу, HTML-код или поисковый запрос">
			<button id="pwoffer" class="inner pwoffer hidden" title="Сохранить пароль" data-icon="passwords">
			</button>
			<button id="safemode" class="inner safemode hidden" title="Безопасный режим: расширения, аддоны, свои кнопки и настройки панелей не применяются. Нажми, чтобы выйти" data-icon="safemode" data-icon-size="16">
				<span>Безопасный режим</span>
			</button>
			<button id="zoom" class="inner zoom hidden" title="Масштаб страницы: нажми, чтобы вернуть 100%"></button>
			<button id="star" class="inner" title="Добавить в закладки (Ctrl+D)" disabled data-icon="star">
			</button>
		</div>
		<button id="update" class="hidden" title="Доступно обновление" data-icon="update">
		</button>
		<button id="translate" title="Перевести страницу (Ctrl+Shift+Y)" data-icon="translate">
		</button>
		<button id="darkpage" title="Тёмная тема страницы (Ctrl+Shift+L)" data-icon="darkpage">
		</button>
		<button id="clock" class="clock off" translate="no"></button>
		<button id="date" class="clock off" translate="no"></button>
		<button id="chars" title="Таблица символов" data-icon="chars">
		</button>
		<button id="bookmarks" title="Закладки (Ctrl+Shift+O)" data-icon="bookmarks">
		</button>
		<button id="passwords" title="Пароли (Ctrl+Shift+K)" data-icon="passwords">
		</button>
		<button id="history" title="История (Ctrl+H)" data-icon="history">
		</button>
		<button id="downloads" title="Загрузки (Ctrl+J)" data-icon="downloads">
		</button>
		<button id="settings" title="Настройки (Ctrl+,)" data-icon="settings">
		</button>
	</div>
	<div id="sp1" class="spacer off"></div>
	<div id="sp2" class="spacer off"></div>
	<div id="sp3" class="spacer off"></div>
	<div id="sp4" class="spacer off"></div>
	<div class="xbar" id="xbar"></div>
	<div class="bmbar" id="bmbar"><div class="bmlist" id="bmlist"></div></div>
	<div class="mid"></div>
	<div id="winctl" class="winctl">
		<button id="win-min" title="Свернуть"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h8"/></svg></button>
		<button id="win-max" title="Развернуть"><svg id="win-max-icon" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="2.2" width="7.6" height="7.6"/></svg></button>
		<button id="win-close" class="close-win" title="Закрыть"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
	</div>
	<script src="renderer.js"></script>
</body>
</html>
