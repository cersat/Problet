<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'">
	<script src="pages/i18n-en.js"></script>
	<script src="pages/i18n.js"></script>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="find.css">
</head>
<body>
	<input id="q" type="text" placeholder="Найти на странице" spellcheck="false" autocomplete="off">

</body>
</html>
