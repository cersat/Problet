name: Сборка

# Сборка под Windows, Linux и macOS при каждом изменении кода
on:
  # Документация (README, сайт в docs/) и настройки GitHub (.github) в программу не попадают: если поменялись только они, сборки нет
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md', '.github/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.github/**']
  # Ручной запуск: собрать старую версию (тег, например v8.0.0) и выложить файлы в её релиз
  workflow_dispatch:
    inputs:
      ref:
        description: 'Тег или коммит для сборки и выкладки в релиз этой версии (пусто — обычная сборка выбранной ветки)'
        required: false
        default: ''

# Идущая сборка не отменяется новым пушем: новый запуск ждёт своей очереди, а из ожидающих остаётся только последний
concurrency:
  group: build-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Проверка синтаксиса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: node --check для всех скриптов
        run: |
          for f in *.js pages/*.js; do node --check "$f"; done

  # Релиз «latest» готовится до сборок. Каждая сборка потом сама докладывает в него свои файлы, не дожидаясь остальных
  prepare:
    name: Подготовка релиза latest
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      keep: ${{ steps.ver.outputs.keep }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Первое или второе число версии (a.b.x) новое, и релиза с такими a.b ещё нет: сохраняем отдельный релиз, его не затрёт следующая сборка
      - name: Новая версия a.b
        id: ver
        run: |
          cur=$(node -p "require('./package.json').version")
          keep=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -z "$(git tag -l "v${cur%.*}.*")" ]; then keep=true; fi
          fi
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
          echo "version=$cur" >> "$GITHUB_OUTPUT"
          echo "версия $cur, отдельный релиз: $keep"
      - name: Перенос метки и релиз latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          notes="Автосборка из коммита ${GITHUB_SHA::7}. Файлы для каждой системы появляются по мере готовности: Linux, Windows и macOS."
          # Последняя сборка — обычный релиз с меткой «Latest»: иначе GitHub вешает её на самый свежий релиз версии
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease=false --latest --title "Последняя сборка" --notes "$notes"
          else
            gh release create latest --latest --target "$GITHUB_SHA" --title "Последняя сборка" --notes "$notes"
          fi

  build:
    name: Сборка ${{ matrix.name }}
    needs: [check, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
            token: linux
          - name: Windows
            os: windows-latest
            args: --win
            token: win
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64
            token: mac
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Артефакты
        uses: actions/upload-artifact@v7
        with:
          name: Problet-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip
            dist/*.dmg
      # Пуш в main: файлы этой системы сразу попадают в latest, остальные сборки не ждём
      - name: Выложить в latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls dist/*.AppImage dist/*.tar.gz dist/*.exe dist/*.zip dist/*.dmg 2>/dev/null || true)
          [ -n "$files" ] || { echo "Нет файлов для выкладки"; exit 1; }
          gh release upload latest $files --clobber
          keep=$(for f in $files; do basename "$f"; done)
          # убрать старые версии файлов этой системы, чтобы обновление не нашло устаревший
          gh release view latest --json assets --jq '.assets[].name' | grep -- "-${{ matrix.token }}-" | while read -r name; do
            echo "$keep" | grep -qxF "$name" || gh release delete-asset latest "$name" --yes
          done

      # Ручной запуск с тегом: файлы этой системы попадают в релиз этой версии
      - name: Выложить в релиз версии
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref }}
        run: |
          files=$(ls dist/*.AppImage dist/*.tar.gz dist/*.exe dist/*.zip dist/*.dmg 2>/dev/null || true)
          [ -n "$files" ] || { echo "Нет файлов для выкладки"; exit 1; }
          gh release upload "$TAG" $files --clobber

  # Первое или второе число версии изменилось: сохраняем отдельный релиз v<версия> со всеми файлами, его не затрёт следующая сборка
  keep-release:
    name: Отдельный релиз версии
    needs: [prepare, build]
    if: needs.prepare.outputs.keep == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Релиз версии
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          ls -la out
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Problet $VERSION" --generate-notes --latest=false # метка «Latest» остаётся у последней сборки
          fi
