name: Сборка

# Сборка под Windows, Linux и macOS при каждом изменении кода
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка синтаксиса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: node --check для всех скриптов
        run: |
          for f in *.js pages/*.js; do node --check "$f"; done

  # Релиз «latest» готовится до сборок. Каждая сборка потом сама докладывает в него свои файлы, не дожидаясь остальных
  prepare:
    name: Подготовка релиза latest
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Перенос метки и релиз latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          notes="Автосборка из коммита ${GITHUB_SHA::7}. Файлы для каждой системы появляются по мере готовности: Linux, Windows и macOS."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease --title "Последняя сборка" --notes "$notes"
          else
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Последняя сборка" --notes "$notes"
          fi

  build:
    name: Сборка ${{ matrix.name }}
    needs: [check, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
            token: linux
          - name: Windows
            os: windows-latest
            args: --win
            token: win
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64
            token: mac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Артефакты
        uses: actions/upload-artifact@v7
        with:
          name: Problet-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip
            dist/*.dmg
      # Пуш в main: файлы этой системы сразу попадают в latest, остальные сборки не ждём
      - name: Выложить в latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls dist/*.AppImage dist/*.tar.gz dist/*.exe dist/*.zip dist/*.dmg 2>/dev/null || true)
          [ -n "$files" ] || { echo "Нет файлов для выкладки"; exit 1; }
          gh release upload latest $files --clobber
          keep=$(for f in $files; do basename "$f"; done)
          # убрать старые версии файлов этой системы, чтобы обновление не нашло устаревший
          gh release view latest --json assets --jq '.assets[].name' | grep -- "-${{ matrix.token }}-" | while read -r name; do
            echo "$keep" | grep -qxF "$name" || gh release delete-asset latest "$name" --yes
          done

  # Метка v* — отдельный релиз с этой версией, когда готовы все сборки
  release:
    name: Релиз по метке
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Список файлов
        run: ls -la out
      - name: Релиз по метке
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Problet ${GITHUB_REF_NAME#v}" --generate-notes
