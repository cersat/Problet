name: Предложить идею
description: Новая возможность или улучшение
title: "[Идея] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что добавить
      description: Опиши, как это должно выглядеть и работать.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно
      description: Какую задачу это решает.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Как это сделано в других браузерах
      description: Если есть пример в Chrome, Firefox или другом браузере, расскажи про него.
    validations:
      required: false
